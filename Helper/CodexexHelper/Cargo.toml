[package]
name = "codexex-helper"
version = "0.1.0"
edition = "2024"

[features]
internal-env-overrides = []

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
codex-protocol = { git = "https://github.com/openai/codex", rev = "be6e8eac029b183056b7e4402879f15d2c85f61b", package = "codex-protocol" }
codex-backend-client = { git = "https://github.com/openai/codex", rev = "be6e8eac029b183056b7e4402879f15d2c85f61b", package = "codex-backend-client" }
codex-client = { git = "https://github.com/openai/codex", rev = "be6e8eac029b183056b7e4402879f15d2c85f61b", package = "codex-client" }
codex-login = { git = "https://github.com/openai/codex", rev = "be6e8eac029b183056b7e4402879f15d2c85f61b", package = "codex-login" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
urlencoding = "2"

[dev-dependencies]
pretty_assertions = "1"
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
